<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bookmark Sharing App User Select</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <form action="addbookmark.html" method="get">
        <label for="userSelector">Select a user:</label>

        </select>
        <button type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
